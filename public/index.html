<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Corrected Tab Title to your site name -->
        <title>Educate | Backend Engine</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet" />

        <style>
            :root {
                --brand: #0a47c2;
                --brand-glow: rgba(10, 71, 194, 0.4);
                --bg: #030712;
                --surface: rgba(255, 255, 255, 0.02);
                --border: rgba(255, 255, 255, 0.08);
                --text-main: #ffffff;
                --text-dim: #94a3b8;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: var(--bg);
                color: var(--text-main);
                height: 100vh;
                width: 100vw;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            /* Animated Mesh Background */
            .mesh {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                background: radial-gradient(at 0% 0%, rgba(10, 71, 194, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(10, 71, 194, 0.1) 0px, transparent 50%);
            }

            .container {
                width: 90%;
                max-width: 1000px;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3rem;
            }

            /* Logo Section */
            .brand-logo {
                font-size: 1.5rem;
                font-weight: 800;
                letter-spacing: 0.1em;
                display: flex;
                align-items: center;
                gap: 12px;
                opacity: 0.8;
            }

            .logo-square {
                width: 24px;
                height: 24px;
                background: var(--brand);
                border-radius: 4px;
                box-shadow: 0 0 20px var(--brand-glow);
            }

            /* Hero Content */
            .hero h1 {
                font-size: clamp(3rem, 10vw, 8rem);
                font-weight: 800;
                line-height: 0.9;
                letter-spacing: -0.04em;
                margin-bottom: 1.5rem;
                background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.4) 100%);
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .hero p {
                color: var(--text-dim);
                font-size: 1.1rem;
                max-width: 500px;
                margin: 0 auto;
                line-height: 1.6;
            }

            /* Status Indicator */
            .status-pill {
                padding: 8px 16px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid var(--border);
                border-radius: 100px;
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 0.8rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                color: var(--brand);
            }

            .pulse {
                width: 8px;
                height: 8px;
                background: #00f2fe;
                border-radius: 50%;
                box-shadow: 0 0 12px #00f2fe;
                animation: pulse-animation 2s infinite;
            }

            @keyframes pulse-animation {
                0% {
                    transform: scale(0.95);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.2);
                    opacity: 0.5;
                }
                100% {
                    transform: scale(0.95);
                    opacity: 1;
                }
            }

            /* Info Bar */
            .info-bar {
                display: flex;
                gap: 4rem;
                margin-top: 2rem;
                padding: 2rem;
                border-top: 1px solid var(--border);
                border-bottom: 1px solid var(--border);
            }

            .info-item {
                display: flex;
                flex-direction: column;
                gap: 4px;
                text-align: left;
            }

            .info-item label {
                font-size: 0.65rem;
                text-transform: uppercase;
                color: var(--text-dim);
                font-weight: 700;
                letter-spacing: 0.1em;
            }

            .info-item span {
                font-size: 1rem;
                font-weight: 500;
            }

            footer {
                position: fixed;
                bottom: 3rem;
                width: 100%;
                display: flex;
                justify-content: center;
                gap: 2rem;
                color: var(--text-dim);
                font-size: 0.75rem;
                font-weight: 500;
            }

            #time {
                font-family: monospace;
                color: var(--brand);
            }

            @media (max-width: 768px) {
                .info-bar {
                    flex-direction: column;
                    gap: 2rem;
                    padding: 2rem 0;
                }
                .hero h1 {
                    font-size: 4rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="mesh"></div>

        <div class="container">
            <div class="status-pill">
                <div class="pulse"></div>
                SYSTEM_STABLE
            </div>

            <div class="brand-logo">
                <div class="logo-square"></div>
                EDUCATE
            </div>

            <div class="hero">
                <h1>Active.</h1>
                <p>The core engine for Educate platform is running in optimized production mode.</p>
            </div>

            <div class="info-bar">
                <div class="info-item">
                    <label>Environment</label>
                    <span>Production</span>
                </div>
                <div class="info-item">
                    <label>Port</label>
                    <span>5000</span>
                </div>
                <div class="info-item">
                    <label>Uptime</label>
                    <span id="time">00:00:00</span>
                </div>
            </div>
        </div>

        <footer>
            <span>&copy; <span id="year"></span> EDUCATE PLATFORM</span>
            <span>|</span>
            <span>BUILD_VERSION: 1.0.0</span>
        </footer>

        <script>
            document.getElementById("year").textContent = new Date().getFullYear();

            // Simple uptime counter simulation
            let seconds = 0;
            function updateUptime() {
                seconds++;
                const h = Math.floor(seconds / 3600)
                    .toString()
                    .padStart(2, "0");
                const m = Math.floor((seconds % 3600) / 60)
                    .toString()
                    .padStart(2, "0");
                const s = (seconds % 60).toString().padStart(2, "0");
                document.getElementById("time").textContent = `${h}:${m}:${s}`;
            }
            setInterval(updateUptime, 1000);
        </script>
    </body>
</html>
